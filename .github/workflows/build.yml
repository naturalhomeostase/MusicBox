name: Build Music Box

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      # keystore/debug.keystore já vem commitado no repositório (é a senha
      # pública padrão do Android, não é segredo).

      # keystore/release.keystore é reconstruído aqui a partir do secret
      # RELEASE_KEYSTORE_BASE64. Nunca é commitado no repositório.
      - name: Restaurar keystore de release (a partir do secret)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > keystore/release.keystore

      - name: Build debug (assembleDebug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release (assembleRelease)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease --stacktrace

      # .aab (Android App Bundle) é o formato que a Google Play exige hoje
      # em dia pra publicação — o .apk de release continua útil pra testar
      # fora da loja (instalar direto no celular), mas não serve mais pra
      # subir na Play Store.
      - name: Build release (bundleRelease .aab)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        run: ./gradlew bundleRelease --stacktrace

      - name: Publicar APK de debug
        uses: actions/upload-artifact@v4
        with:
          name: musicbox-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publicar APK de release
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: musicbox-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Publicar AAB de release (para a Play Store)
        if: ${{ env.RELEASE_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: musicbox-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
